
{% extends "layout.html" %}
{% from "items/classes.html" import class_choices %}

{% block title %}Edit item{% endblock %}

{% block content %}
<h2>Edit item</h2>

<form action="{{ url_for('item_edit', item_id=item.id) }}" method="post" enctype="multipart/form-data">
	<p>
		<input type="text" id="title" name="title" value="{{ filled.title }}" 
		maxlength="100" required placeholder="title of PDF" />
	</p>
	<p>
		<input type="text" id="keywords" name="keywords" value="{{ filled.keywords }}"
			   maxlength="400" placeholder="keywords (comma-separated): e.g. cs, physics, ml" />
	</p>
	{{ class_choices(all_classes, filled.classes) }}
	<p>
	<label for="pdf">Replace PDF file (optional, max {{ max_pdf_mb }} MB):</label><br />
		<input type="file" id="pdf" name="pdf" accept="application/pdf" />
		<br />
		<small>Current file: {{ item.filename }}. Leave empty to keep it.</small>
	</p>
	<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
	<button type="submit">Save changes</button>
</form>
{% endblock %}
