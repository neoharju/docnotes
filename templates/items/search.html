{% macro search_form(search="", sort="recent") %}
<form class="search-form" action="{{ url_for('item_list') }}" method="get">
	<label for="search" class="visually-hidden">Search PDFs</label>
	<input type="text" id="search" name="search" value="{{ search }}" maxlength="200"
				 placeholder="Search by title, filename, uploader or keyword..." />
	{% if sort != "recent" %}
		<input type="hidden" name="sort" value="{{ sort }}" />
	{% endif %}
	<button type="submit">Search</button>
	{% if search %}
		<a class="button" href="{{ url_for('item_list') }}">Clear</a>
	{% endif %}
</form>
{% endmacro %}
