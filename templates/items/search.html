{% macro search_form(search="") %}
<form class="search-form" action="{{ url_for('item_list') }}" method="get">
	<input type="text" name="search" value="{{ search }}" maxlength="200" aria-label="Search PDFs"
				 placeholder="Search by title, filename, uploader or keyword..." />
	<button type="submit">Search</button>
	{% if search %}
		<a class="button" href="{{ url_for('item_list') }}">Clear</a>
	{% endif %}
</form>
{% endmacro %}
