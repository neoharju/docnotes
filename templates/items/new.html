{% extends "layout.html" %}
{% from "items/classes.html" import class_choices %}

{% block title %}Upload a PDF{% endblock %}

{% block content %}
<h2>Upload a PDF</h2>

<form action="{{ url_for('item_new') }}" method="post" enctype="multipart/form-data">
	<p>
	<label for="title">Title</label><br />
	<input type="text" id="title" name="title" value="{{ filled.title }}"
			maxlength="100" required />
	</p>
	<p>
	<label for="keywords">Keywords (comma-separated)</label><br />
	<input type="text" id="keywords" name="keywords" value="{{ filled.keywords }}"
		   maxlength="400" placeholder="e.g. cs, physics, ml" />
	</p>
	{{ class_choices(all_classes, filled.classes or []) }}
	<p>
	<label for="pdf">PDF file (max {{ max_pdf_mb}} MB):</label><br />
	<input type="file" id="pdf" name="pdf" accept="application/pdf" required
										   />
	</p>
	<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
	<button type="submit">Upload</button>
</form>
{% endblock %}
