{% extends "layout.html" %}

{% block title %}Upload a PDF{% endblock %}

{% block content %}
<h2>Upload a PDF</h2>

<form action="{{ url_for('item_new') }}" method="post" enctype="multipart/form-data">
	<p>
	<input type="text" id="title" name="title" value="{{ filled.title }}"
			maxlength="100" required placeholder="title of PDF" />
	</p>
	<p>
	<input type="text" id="keywords" name="keywords" value="{{ filled.keywords }}"
		   maxlength="400" placeholder="keywords (comma-separated): e.g. cs,physics,ml" />
	</p>
	<p>
	<label for="pdf">PDF file (max 10 MB):</label><br />
	<input type="file" id="pdf" name="pdf" accept="application/pdf" required
										   />
	</p>
	<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
	<button type="submit">Upload</button>
</form>
{% endblock %}
